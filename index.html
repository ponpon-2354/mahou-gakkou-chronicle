      if(['stone','path','hall'].includes(kind)){const v=seed%3,patch=(((gx>>1)*31+(gy>>1)*57)>>>0)%3;ctx.fillStyle=['rgba(255,244,220,.08)','rgba(30,30,40,.08)','rgba(120,100,70,.07)'][patch];ctx.fillRect(x,y,32,32);ctx.fillStyle=['#d1c6ad44','#fff4dc33','#403d3944'][v];ctx.fillRect(x+2+(seed%19),y+3+((seed>>>5)%23),7,2);ctx.strokeStyle='rgba(53,54,56,.45)';ctx.beginPath();const jy=8+(seed%17),jx=((gy%2)*16)+4+(seed%9);ctx.moveTo(x,y+jy);ctx.lineTo(x+32,y+jy);ctx.moveTo(x+jx,y);ctx.lineTo(x+jx,y+jy);ctx.moveTo(x+((jx+17)%32),y+jy);ctx.lineTo(x+((jx+17)%32),y+32);ctx.stroke();ctx.fillStyle='#e7dcc255';ctx.fillRect(x+3,y+2,5,1);ctx.fillRect(x+20,y+jy+3,4,1);}

    drawQuestBoard(ctx) { const p=this.maps[this.mapId].board;if(!p)return;const x=p.x*TILE+6-this.camera.x,y=p.y*TILE+3-this.camera.y;ctx.fillStyle='#392619';ctx.fillRect(x+3,y+5,20,26);ctx.fillStyle='#80502e';ctx.fillRect(x,y,26,20);ctx.strokeStyle='#c99a5b';ctx.lineWidth=2;ctx.strokeRect(x,y,26,20);for(const[a,b]of [[4,4],[13,3],[8,11]]){ctx.fillStyle='#f0dfb4';ctx.fillRect(x+a,y+b,8,5);ctx.fillStyle='#806849';ctx.fillRect(x+a+1,y+b+2,5,1);} } ,
