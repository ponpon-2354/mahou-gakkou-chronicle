      if(kind==='table'&&this.tiles[gy+1]?.[gx]!=='table'){ctx.fillStyle='#533725';ctx.fillRect(x+1,y+23,30,7);ctx.fillStyle='#d1a66b';ctx.fillRect(x+2,y+22,28,1);if(seed%10<4){const ox2=6+(seed%12);ctx.fillStyle='#eee0bd';ctx.fillRect(x+ox2,y+8+(seed%5),10,7);ctx.fillStyle='#735642';ctx.fillRect(x+ox2+4,y+9+(seed%5),1,5);}else if(seed%10<6){ctx.fillStyle='#e8e2d2';ctx.beginPath();ctx.ellipse(x+11+(seed%8),y+12,5,3,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#c8b490';ctx.fillRect(x+20,y+8+(seed%6),3,3);}else if(seed%10===6){ctx.fillStyle='#c9a24a';ctx.fillRect(x+14,y+10,3,5);ctx.fillStyle='#ffd36b';ctx.fillRect(x+15,y+7,1,3);}}
      if(kind==='fireplace'){ctx.fillStyle='#4a4038';ctx.fillRect(x+1,y+1,30,4);ctx.fillStyle='#a8927a';ctx.fillRect(x+1,y+1,30,1);for(let q=0;q<3;q++)ctx.fillStyle='rgba(30,25,22,.35)',ctx.fillRect(x+3+q*9,y+8,1,22);ctx.fillStyle='#5a3a22';ctx.fillRect(x+10,y+24,12,3);ctx.fillRect(x+12,y+21,9,3);if(seed%2){ctx.fillStyle='#7a4a5a';ctx.fillRect(x+24,y-3,4,5);ctx.fillStyle='#e8e0c8';ctx.fillRect(x+5,y-2,2,3);}}
      if(kind==='bed'&&this.tiles[gy+1]?.[gx]!=='bed'){ctx.fillStyle='#4a3025';ctx.fillRect(x+2,y+27,28,4);ctx.fillStyle='#fffaf0';ctx.fillRect(x+4,y+5,9,6);ctx.fillStyle='#b8c6cf';ctx.fillRect(x+5,y+10,7,1);for(let q=0;q<2;q++){ctx.strokeStyle='rgba(70,45,70,.45)';ctx.beginPath();ctx.moveTo(x+17+q*6,y+15);ctx.lineTo(x+16+q*6,y+24);ctx.stroke();}}
      // Deterministic material grain keeps each tile stable between redraws.
      if(['stone','path','hall'].includes(kind)){const v=seed%3,patch=(((gx>>1)*31+(gy>>1)*57)>>>0)%3;ctx.fillStyle=['rgba(255,244,220,.08)','rgba(30,30,40,.08)','rgba(120,100,70,.07)'][patch];ctx.fillRect(x,y,32,32);ctx.fillStyle=['#d1c6ad44','#fff4dc33','#403d3944'][v];ctx.fillRect(x+2+(seed%19),y+3+((seed>>>5)%23),7,2);ctx.strokeStyle='rgba(53,54,56,.45)';ctx.beginPath();const jy=8+(seed%17),jx=((gy%2)*16)+4+(seed%9);ctx.moveTo(x,y+jy);ctx.lineTo(x+32,y+jy);ctx.moveTo(x+jx,y);ctx.lineTo(x+jx,y+jy);ctx.moveTo(x+((jx+17)%32),y+jy);ctx.lineTo(x+((jx+17)%32),y+32);ctx.stroke();ctx.fillStyle='#e7dcc255';ctx.fillRect(x+3,y+2,5,1);ctx.fillRect(x+20,y+jy+3,4,1);}
      if(['wood','classroom','library','dorm','shop'].includes(kind)){ctx.fillStyle='#e2bd7655';for(let q=0;q<3;q++){const yy=4+q*10+((seed>>q)&1);ctx.fillRect(x+2,y+yy,25-(seed%7),1);}if(seed%11===0){ctx.strokeStyle='#38261988';ctx.beginPath();ctx.ellipse(x+8+(seed%17),y+13,4,2,0,0,6.28);ctx.stroke();}}
      if(kind==='grass'){ctx.fillStyle=seed%7===0?'#e7d593':'#1b422f';for(let q=0;q<7;q++){const px=x+((seed+q*13)%29),py=y+((seed>>>2+q*9)%29);ctx.fillRect(px,py,1,3+(q%3));}if(seed%19===0){ctx.fillStyle='#edc6dc';ctx.fillRect(x+9,y+11,2,2);}}
      if(kind==='water'){ctx.fillStyle='#63b4d0';ctx.fillRect(x+((seed>>>4)%20),y+((seed>>>9)%26),8,1);ctx.fillStyle='#164f75';ctx.fillRect(x+((seed>>>7)%20),y+((seed>>>12)%26),5,1);}
      if(kind==='bookshelf'){ctx.fillStyle='#f3d98a';ctx.fillRect(x+5,y+7,1,3);ctx.fillRect(x+15,y+12,1,2);ctx.fillRect(x+24,y+8,1,3);}
      if(kind==='carpet'){ctx.strokeStyle='#d8ad68aa';ctx.beginPath();ctx.moveTo(x+8,y+16);ctx.lineTo(x+16,y+8);ctx.lineTo(x+24,y+16);ctx.lineTo(x+16,y+24);ctx.closePath();ctx.stroke();}
    },
    drawQuestBoard(ctx) { const p=this.maps[this.mapId].board;if(!p)return;const x=p.x*TILE+6-this.camera.x,y=p.y*TILE+3-this.camera.y;ctx.fillStyle='#392619';ctx.fillRect(x+3,y+5,20,26);ctx.fillStyle='#80502e';ctx.fillRect(x,y,26,20);ctx.strokeStyle='#c99a5b';ctx.lineWidth=2;ctx.strokeRect(x,y,26,20);for(const[a,b]of [[4,4],[13,3],[8,11]]){ctx.fillStyle='#f0dfb4';ctx.fillRect(x+a,y+b,8,5);ctx.fillStyle='#806849';ctx.fillRect(x+a+1,y+b+2,5,1);} } ,
    drawSigns(ctx) { const signs=this.maps[this.mapId].signs;ctx.font='bold 11px sans-serif';ctx.textAlign='center';signs.forEach(([t,x,y])=>{const px=x*TILE+16-this.camera.x,py=y*TILE+16-this.camera.y;ctx.fillStyle='#101726cc';ctx.fillRect(px-44,py-12,88,24);ctx.strokeStyle='#e6d29a';ctx.strokeRect(px-44,py-12,88,24);ctx.fillStyle='#fff1c7';ctx.fillText(t,px,py+5);}); },
  };
  window.MahouGame = game; game.init();
})();
