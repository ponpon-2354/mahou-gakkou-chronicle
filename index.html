<body>
  <main id="app">
    <section id="title-screen" class="screen title-screen">
      <canvas id="title-art" width="960" height="540"></canvas>
      <div class="title-card">
        <p class="eyebrow">MAGIC ACADEMY ADVENTURE</p>
        <h1>魔法学校<br>クロニクル</h1>
        <p class="subtitle">魔法学院で始まる、ユウキたちの物語。</p>
        <div class="title-actions">
          <button id="new-game">はじめから</button>
          <button id="continue-game">つづきから</button>
        </div>
        <p class="hint">キーボード: 矢印 / WASD 移動・Enter 決定・Esc メニュー</p>
      </div>
    </section>

    <section id="game-screen" class="screen game-screen hidden">
      <header class="topbar"><strong>魔法学校クロニクル</strong><span id="location-label">魔法学院</span><button id="menu-button" aria-label="メニュー">☰ メニュー</button></header>
      <div class="game-layout">
        <div class="world-frame"><canvas id="world" width="960" height="640" aria-label="魔法学院マップ"></canvas><canvas id="world-fg" width="960" height="640"></canvas><div id="toast" class="toast"></div></div>
        <aside class="side-panel"><h2>ユウキ <small>1年</small></h2><div id="party-hud"></div><div class="controls-note">近くの人や教壇で決定<br>訓練場に入るとバトル</div>
          <div class="touch-controls"><button data-move="up">▲</button><button data-move="left">◀</button><button data-move="down">▼</button><button data-move="right">▶</button></div>
          <button id="interact-button" class="wide">はなす / 決定</button>
        </aside>
      </div>
    </section>

    <section id="dialogue" class="overlay hidden" role="dialog" aria-modal="true"><div class="dialogue-box"><strong id="dialogue-name"></strong><p id="dialogue-text"></p><button id="dialogue-next">つづける ▶</button></div></section>
    <section id="menu" class="overlay hidden" role="dialog" aria-modal="true"><div class="panel"><button class="close" data-close="menu">×</button><h2>メニュー</h2><nav class="menu-tabs"><button data-tab="status">ステータス</button><button data-tab="items">アイテム</button><button data-tab="save">セーブ</button><button data-tab="settings">せってい</button></nav><div id="menu-content"></div><div class="menu-footer"><button id="save-button">手動セーブ</button><button id="load-button">手動ロード</button><button id="title-button">タイトルへ</button></div></div></section>
    <section id="battle" class="overlay hidden" role="dialog" aria-modal="true"><div class="battle-panel"><div class="battle-heading"><span>訓練バトル</span><span id="turn-label"></span></div><div id="battle-field"></div><div id="battle-log" aria-live="polite"></div><div id="battle-actions"></div></div></section>
    <section id="game-over" class="overlay hidden"><div class="panel game-over-panel"><h2>ゲームオーバー</h2><p>みんな力尽きてしまった……。</p><button id="retry-save">セーブから再開</button><button id="game-over-title">タイトルへ</button></div></section>
    <div id="confirm-dialog" class="overlay hidden" role="dialog" aria-modal="true"><div class="panel"><h2 id="confirm-title"></h2><p id="confirm-text"></p><div class="confirm-actions"><button id="confirm-yes">はい</button><button id="confirm-no">いいえ</button></div></div></div>
  </main>

  <script>
(function (root) {
  'use strict';
  const down = ["................",".....HHHHHH.....","....HHHHHHHH....","...HHHHHHHHHH...","...HHSSSSSSHH...","...HHSSSSSSHH...","...HHSESSESHH...","...HHSSSSSSHH...","....SSSSSSSS....",".....SSSSSS.....","...RRRRRRRRRR...","..RRRRTTTTRRRR..","..RRRRTTTTRRRR..","..SRRRRRRRRRRS..","..SRRRrrrrRRRS..","...RRRrrrrRRR...","...RRRRRRRRRR...","...TTTTTTTTTT..."];
  const up = ["................",".....HHHHHH.....","....HHHHHHHH....","...HHHHHHHHHH...","...HHHHHHHHHH...","...HHHHHHHHHH...","...HHhhhhhhHH...","...HHHHHHHHHH...","....HHHHHHHH....","...RRRRRRRRRR...","..RRRRRRRRRRRR..","..RRRRRRRRRRRR..","..RRRRRTTRRRRR..","..SRRRRRRRRRRS..","..SRRRrrrrRRRS..","...RRRrrrrRRR...","...RRRRRRRRRR...","...TTTTTTTTTT..."];
  const left = ["................",".....HHHHHH.....","....HHHHHHHH....","...HHHHHHHHHH...","...HHHHSSSSHH...","...HHHSSSSSH....","...HHHESSSSH....","...HHHSSSSSH....","....SSSSSSS.....",".....SSSSS......","....RRRRRRRR....","....RRRRTTRR....","....RRRRRRRR....","....RRRSRRRR....","....RRRrrrrR....","....RRrrrrRR....","....RRRRRRRR....","....TTTTTTTT...."];
  const legsA = ["....PP....PP....","...FFF....FFF..."];
  const legsB = [".....PP...PP....","....FFF...FFF..."];
  const leftLegsA = ["....PP...PP.....","...FFF....FFF..."];
  const leftLegsB = [".....PPPP.......",".....FFFF......."];
  const palettes = {
    yuuki:{H:'#4a3226',h:'#2e1f16',S:'#f3d4b6',E:'#20222e',R:'#493c81',r:'#352c61',T:'#f0c95f',P:'#3a3f4a',F:'#5a3d26'},
    leo:{H:'#8a5a24',h:'#5f3d16',S:'#f3d4b6',E:'#20222e',R:'#2e6da4',r:'#20507a',T:'#ffe9a8',P:'#3a3f4a',F:'#4a3226'},
    milia:{H:'#d1608f',h:'#9c3f66',S:'#f7dbc4',E:'#33222e',R:'#7a3b69',r:'#592a4c',T:'#ffd98a',P:'#41334a',F:'#4a2c3a',longHair:true},
    alberto:{H:'#d8d8e0',h:'#a8a8b8',S:'#eecfa8',E:'#20222e',R:'#96762e',r:'#6f5620',T:'#ffe9a8',P:'#4a4038',F:'#3a2e22',beard:true,beardColor:'#e8e8f0'},
    elena:{H:'#8a63c9',h:'#5f3f96',S:'#f7dbc4',E:'#262038',R:'#3f5f8a',r:'#2c4465',T:'#f0c95f',P:'#3a3f4a',F:'#3a2c4a',longHair:true}
  };
  const enemyMaps = {
    slime:["..........BBBB..........","........BBBBBBBB........",".......BBBBBBBBBB.......","......BBBBBBBBBBBB......",".....BBBBBBBBBBBBBB.....","....BBBWWBBBBBBBBBBB....","....BBWWBBBBBBBBBBBB....","...BBBBBBBBBBBBBBBBBB...","...BBBBEEBBBBEEBBBBBB...","...BBBBBBBBBBBBBBBBBB...","..BBBBBBBBBBBBBBBBBBBB..","..BBBBBBBBBMMBBBBBBBBB..","..BBBBBBBBBBBBBBBBBBBB..","..bbbbBBBBBBBBBBBBbbbb..",".bbbbbbbbbbbbbbbbbbbbbb."],
    wolf:["..GG................GG..","..GGG..............GGG..","..GIGG............GGIG..","..GGGGG........GGGGG....","..GGGGGGGGGGGGGGGGGGG...",".GGGGGGGGGGGGGGGGGGGGG..",".GGGGGGGGGGGGGGGGGGGGG..",".GGGEEGGGGGGGGGGEEGGGG..",".GGGGGGGGGGGGGGGGGGGGG..","..GGGGGWWWWWWWWGGGGG....","..GGGGWWWWNNNNWWWWGGGG..","..GGGGGWWWWWWWWGGGGG....","...GGGGGGGGGGGGGGGG.....","..GGGGGGGGGGGGGGGGGGGG..",".GGgGGGGGGGGGGGGGGGGgGG.",".GGGGGGGGGGGGGGGGGGGGGG.",".GGGGGGgGGGGGGGGgGGGGGG.","..FFFF....FFFF....FFFF..","..FFFF....FFFF....FFFF.."]
  };
  const enemyColors={slime:{B:'#5bb5e8',b:'#2f7fb8',W:'#e6f7ff',E:'#14324a',M:'#14486b'},wolf:{G:'#98a2ab',g:'#6e777f',W:'#eef2f5',E:'#1c2733',N:'#2a2f36',I:'#d98a94',F:'#565e66'}};
  function paint(ctx, rows, colors, x, y, scale) { rows.forEach((row, yy) => Array.from(row).forEach((c, xx) => { if(c!=='.'&&colors[c]) {ctx.fillStyle=colors[c];ctx.fillRect(x+xx*scale,y+yy*scale,scale,scale);} })); }
  function drawCharacter(ctx,id,dir,frame,cx,feetY,scale) {
    const pal=palettes[id]||palettes.yuuki, face=dir==='up'?up:dir==='left'||dir==='right'?left:down;
    const rows=face.map(r=>Array.from(r));
    if(pal.longHair){if(dir==='down'||dir==='up'){for(let y=4;y<(dir==='down'?12:14);y++){rows[y][1]='H';rows[y][14]='H';}}else{for(let y=5;y<=10;y++){rows[y][12]='H';rows[y][13]='H';}}}
    if(pal.beard&&dir==='down'){for(let x=4;x<=11;x++)rows[8][x]='B';for(let x=5;x<=10;x++)rows[9][x]='B';for(let x=6;x<=9;x++)rows[10][x]='B';}
    const colors={...pal,B:pal.beardColor||'#fff'}; const baseX=Math.round(cx-8*scale), baseY=Math.round(feetY-20*scale);
    let legs=((dir==='left'||dir==='right')?(frame?leftLegsB:leftLegsA):(frame?legsB:legsA)).map(r=>Array.from(r));
    if(dir==='right') { const all=rows.concat(legs); paint(ctx,all.map(r=>Array.from(r).reverse().join('')),colors,baseX,baseY,scale); }
    else { paint(ctx,rows.map(r=>r.join('')),colors,baseX,baseY,scale); paint(ctx,legs.map(r=>r.join('')),colors,baseX,baseY+18*scale,scale); }
  }
  function drawEnemy(ctx,id,cx,cy,scale){const rows=enemyMaps[id]||enemyMaps.slime;paint(ctx,rows,enemyColors[id]||enemyColors.slime,Math.round(cx-12*scale),Math.round(cy-rows.length*scale/2),scale);}
  root.MahouSprites={drawCharacter,drawEnemy};
})(window);

</script>
  <script>
(function (root) {
  'use strict';
  const Battle = {
    game: null, enemies: [], turnOrder: [], orderIndex: 0, defending: {}, active: false, done: false,
    start(game) {
      this.game = game; this.active = true; this.done = false; this.defending = {};
      const count = Math.random() < 0.45 ? 2 : 1;
      this.enemies = Array.from({ length: count }, () => {
        const template = MahouData.enemies[Math.floor(Math.random() * MahouData.enemies.length)];
        return { ...template, hp: template.hp, maxHp: template.hp, id: Math.random().toString(36).slice(2), dead: false };
      });
      document.getElementById('battle').classList.remove('hidden');
      document.getElementById('battle-log').innerHTML = '<div>魔法生物があらわれた！</div>';

    applySave(data) { if (!data || !Array.isArray(data.party) || !data.pos) return false; this.party = data.party.map(c => ({ ...c, spells: Array.isArray(c.spells) ? [...c.spells] : [] })); this.items = data.items || {}; this.pos = { x: Math.max(1,Math.min(W-2,Number(data.pos.x)||D.start.x)), y: Math.max(1,Math.min(H-2,Number(data.pos.y)||D.start.y)) }; if (this.treeSet && this.treeSet.has(this.pos.x + ',' + this.pos.y)) { const free = [[1,0],[-1,0],[0,1],[0,-1]].map(([dx,dy]) => ({ x: this.pos.x + dx, y: this.pos.y + dy })).find(p => p.x >= 1 && p.y >= 1 && p.x < W - 1 && p.y < H - 1 && !this.treeSet.has(p.x + ',' + p.y) && this.tiles[p.y][p.x] !== 'wall'); if (free) this.pos = free; }
      this.learnedLesson = Boolean(data.learnedLesson); this.year = data.year || 1; $('title-screen').classList.add('hidden'); $('game-screen').classList.remove('hidden'); $('menu').classList.add('hidden'); $('game-over').classList.add('hidden'); this.battle = false; this.draw(); this.renderHud(); return true; },
    loadManual() { const data = this.readSave('mahou_save_manual'); if (!data || !this.applySave(data)) return this.showToast('手動セーブがありません。'); this.showToast('手動セーブを読み込みました。'); },
    loadAny(showToast = true) { const manual = this.readSave('mahou_save_manual'), auto = this.readSave('mahou_save_auto'); const data = manual && auto ? ((auto.savedAt || 0) > (manual.savedAt || 0) ? auto : manual) : (manual || auto); if (!data || !this.applySave(data)) { if (showToast) this.showToast('読み込めるセーブがありません。'); return false; } if (showToast) this.showToast('セーブから再開しました。'); return true; },
    showToast(text) { const el = $('toast'); el.textContent = text; el.classList.add('show'); clearTimeout(this.toastTimer); this.toastTimer = setTimeout(() => el.classList.remove('show'), 1800); },
    buildArt() {
      this.mapBase = document.createElement('canvas'); this.mapBase.width=this.canvas.width; this.mapBase.height=this.canvas.height; this.baseCtx=this.mapBase.getContext('2d');
      this.mapTall = document.createElement('canvas'); this.mapTall.width=this.canvas.width; this.mapTall.height=this.canvas.height; this.tallCtx=this.mapTall.getContext('2d');
      const b=this.baseCtx,t=this.tallCtx;
      for(let y=0;y<H;y++) for(let x=0;x<W;x++) this.drawTile(b,this.tiles[y][x],x*TILE,y*TILE,x,y);
      for(const area of [D.classroom,D.library,D.dorm,D.shop]) {
        const x=area.x1*TILE,y=area.y1*TILE,w=(area.x2-area.x1+1)*TILE,h=(area.y2-area.y1+1)*TILE;
        b.fillStyle='rgba(0,0,0,.28)';b.fillRect(x+8,y+10,w,h);
        t.fillStyle='#493b43';t.fillRect(x,y-8,w,10);t.fillStyle='#b58a59';t.fillRect(x,y-8,w,4);
        t.fillStyle='#5c5362';t.fillRect(x,y,w,9);t.fillRect(x,y+h-19,w,22);
        for(let wx=x+40;wx<x+w-20;wx+=92){t.fillStyle='#463d48';t.fillRect(wx,y+15,28,29);t.fillStyle='#f4c977';t.fillRect(wx+4,y+19,20,21); const g=b.createRadialGradient(wx+14,y+60,2,wx+14,y+60,58);g.addColorStop(0,'rgba(255,190,95,.16)');g.addColorStop(1,'rgba(255,190,95,0)');b.fillStyle=g;b.fillRect(wx-44,y+25,116,80);}
      }
      this.TREES.forEach(([gx,gy])=>{const x=gx*TILE+16,y=gy*TILE+18;b.fillStyle='rgba(0,0,0,.28)';b.beginPath();b.ellipse(x+8,y+7,22,9,0,0,Math.PI*2);b.fill();b.fillStyle='#60432a';b.fillRect(x-4,y-15,9,28); for(let i=0;i<18;i++){const a=((i*37+gx*13+gy*19)%97)/97*Math.PI*2,r=10+((i*17)%35),cx=x+Math.cos(a)*r,cy=y-24+Math.sin(a)*r*.7;t.fillStyle=['#174d37','#236b43','#39804b'][i%3];t.fillRect(Math.round(cx/4)*4,Math.round(cy/4)*4,8,8);}});
      this.fgArt=document.createElement('canvas');this.fgArt.width=960;this.fgArt.height=640;const f=this.fgArt.getContext('2d'); for(const [x,y] of [[-18,590],[90,640],[870,640],[970,590],[930,-10],[20,-10]]){for(let i=0;i<24;i++){f.fillStyle=['#172d2c','#203a32','#294536'][i%3];f.beginPath();f.arc(x+((i*29)%130)-50,y+((i*37)%85)-40,14+(i%4)*6,0,Math.PI*2);f.fill();}}
      this.particles=Array.from({length:36},(_,i)=>({x:(i*173+47)%960,y:(i*97+23)%640,phase:i*1.71}));
    },
    applyBlur(){ if(this.fg) this.fg.closest('.world-frame').classList.toggle('no-blur',!this.settings.blur); },
    drawTitleArt(){const c=$('title-art'),x=c.getContext('2d'),g=x.createLinearGradient(0,0,0,540);g.addColorStop(0,'#101a36');g.addColorStop(.62,'#9a5862');g.addColorStop(1,'#f2a566');x.fillStyle=g;x.fillRect(0,0,960,540);for(let i=0;i<70;i++){x.fillStyle=`rgba(255,240,200,${.3+(i%4)*.1})`;x.fillRect((i*137)%960,(i*71)%260,2,2);}x.fillStyle='#f9dda0';x.beginPath();x.arc(760,115,38,0,7);x.fill();x.fillStyle='#20243a';x.fillRect(0,365,960,175);for(const [bx,by,bw,bh] of [[120,250,170,180],[320,210,150,220],[500,270,180,160],[690,190,170,230]]){x.fillRect(bx,by,bw,bh);x.fillRect(bx+35,by-60,bw-70,60);x.beginPath();x.moveTo(bx+20,by-60);x.lineTo(bx+bw/2,by-120);x.lineTo(bx+bw-20,by-60);x.fill();for(let wx=bx+35;wx<bx+bw-15;wx+=42){x.fillStyle='#ffc979';x.fillRect(wx,by+35,12,20);}x.fillStyle='#20243a';}x.fillStyle='#11182b';x.fillRect(0,480,960,60);},
    animate(){this.animTime=(this.animTime||0)+1;this.draw();requestAnimationFrame(()=>this.animate());},
    draw() {
      if(!this.ctx||!this.mapBase)return;const c=this.ctx;c.clearRect(0,0,960,640);c.drawImage(this.mapBase,0,0);this.drawSigns(c);
      const actors=D.npcs.map(n=>({x:n.x,y:n.y,id:n.sprite})).concat([{x:this.pos.x,y:this.pos.y,id:'yuuki',player:true}]).sort((a,b)=>a.y-b.y);
      actors.forEach(a=>{const cx=a.x*TILE+16,feet=(a.y+1)*TILE-2;c.fillStyle='rgba(0,0,0,.28)';c.beginPath();c.ellipse(cx+5,feet+2,13,5,0,0,Math.PI*2);c.fill();MahouSprites.drawCharacter(c,a.id,a.player?this.facing:'down',a.player?this.walkFrame:0,cx,feet,2);});
      c.drawImage(this.mapTall,0,0);if(!this.lightGradient){this.lightGradient=c.createLinearGradient(0,0,960,640);this.lightGradient.addColorStop(0,'rgba(255,190,90,.05)');this.lightGradient.addColorStop(1,'rgba(255,190,90,.09)');this.vignette=c.createRadialGradient(480,320,150,480,320,560);this.vignette.addColorStop(0,'rgba(8,8,24,0)');this.vignette.addColorStop(1,'rgba(8,8,24,.20)');}
      c.fillStyle=this.lightGradient;c.fillRect(0,0,960,640);c.fillStyle=this.vignette;c.fillRect(0,0,960,640);
      const time=this.animTime||0;this.particles.forEach(p=>{const y=(p.y-time*.16+640)%640;c.fillStyle=`rgba(255,240,200,${.25+(.35*(1+Math.sin(time/35+p.phase)))/2})`;c.fillRect(p.x+Math.sin(time/40+p.phase)*5,y,1+(p.phase%2),1+(p.phase%2));});
      const mist=c.createLinearGradient(0,0,0,90);mist.addColorStop(0,'rgba(255,255,255,.10)');mist.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=mist;c.fillRect(0,0,960,90);
      if(this.settings.blur&&this.fgCtx){this.fgCtx.clearRect(0,0,960,640);this.fgCtx.drawImage(this.canvas,0,0,960,46,0,0,960,46);this.fgCtx.drawImage(this.fgArt,0,0);}
      const loc=this.areaAt(this.pos.x,this.pos.y)||'中央ホール';$('location-label').textContent=loc;
    },
    drawTile(ctx,kind,x,y,gx,gy) {
      const seed=(gx*73856093^gy*19349663)>>>0;const colors={grass:'#294f39',classroom:'#876743',library:'#594d55',dorm:'#715766',shop:'#776746',training:'#92784f',hall:'#888579',wall:'#394554',door:'#60432d'};ctx.fillStyle=colors[kind]||colors.grass;ctx.fillRect(x,y,TILE,TILE);
      if(kind==='grass'){for(let i=0;i<5;i++){const px=x+((seed+i*31)%30),py=y+((seed>>>3+i*17)%30);ctx.fillStyle=i%2?'#47734a':'#355c3e';ctx.fillRect(px,py,2,3);}}
      else if(kind==='hall'||kind==='wall'){ctx.strokeStyle='#202a3266';ctx.strokeRect(x,y,TILE,TILE);ctx.fillStyle='#a8a39755';ctx.fillRect(x+((gx%2)*16)+2,y+4,11,2);ctx.fillRect(x+4,y+19,19,2);}
      else if(['classroom','library','dorm','shop'].includes(kind)){ctx.fillStyle='#251d2266';for(let i=0;i<4;i++)ctx.fillRect(x,y+i*9,TILE,1);for(let i=0;i<4;i++)ctx.fillRect(x+((seed+i*9)%30),y+((seed>>>2+i*7)%30),2,1);if(kind==='library'){ctx.fillStyle='#80614c';ctx.fillRect(x,y+14,TILE,4);}}
      else if(kind==='training'){ctx.fillStyle='#aa9064';for(let i=0;i<5;i++)ctx.fillRect(x+(seed+i*7)%30,y+(seed>>>2+i*11)%30,2,2);ctx.strokeStyle='#d0b27a88';ctx.beginPath();ctx.arc(x+16,y+16,9,0,Math.PI*2);ctx.stroke();}
      else if(kind==='door'){ctx.fillStyle='#9a6d3c';ctx.fillRect(x+6,y+3,20,29);ctx.fillStyle='#d5aa57';ctx.fillRect(x+21,y+16,2,3);}
    },
    drawSigns(ctx) { const signs=[['教室',5,2],['図書館',24,2],['寮',5,17],['ショップ',24,17],['訓練場',14,17],['中央ホール',14,6]];ctx.font='bold 15px sans-serif';ctx.textAlign='center';signs.forEach(([t,x,y])=>{const px=x*TILE+16,py=y*TILE+16;ctx.fillStyle='#101726cc';ctx.fillRect(px-44,py-12,88,24);ctx.strokeStyle='#e6d29a';ctx.strokeRect(px-44,py-12,88,24);ctx.fillStyle='#fff1c7';ctx.fillText(t,px,py+5);}); },
  };
  window.MahouGame = game; game.init();
})();
